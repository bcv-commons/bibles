# Our abbreviation for every Biblica (openbible) project. The catalog uses it as o:<ABBR>
# instead of Biblica's hex project id; catalog/openbible-abbr.json publishes the table
# (abbreviation -> Biblica project id, language, type, scope, title).
#
# Built by `make openbible-abbr` (pipeline/core/generate_openbible_abbr_table.py), which adds
# every new Biblica project to [abbr] at the bottom, once. An abbreviation never changes or gets
# reused after that, since clients key on it. To give a project another abbreviation, edit its
# value in [abbr] (letters, digits and hyphens, unique) and rerun; the script keeps it.
#
# A new project gets, in this order:
#   1. its yaapi.bible abbreviation, where yaapi.bible carries the project (the id
#      catalog/overlap.json and text-route.json already use);
#   2. otherwise `pattern` below, from its language code and Biblica's scope and type:
#      TAWobNT. The lower-case "ob" marks the ones we made, so they can never collide with
#      yaapi.bible's (all capitals);
#   3. if that is taken, the same with 2, 3, ... appended (oldest project first).

[rule]
pattern = "{ISO}ob{SCOPE}{TYPE}" # ISO: the language code in capitals; keep the lower-case "ob"
scope_other = "X"                # a scope not listed below

[rule.scope]                     # Biblica's `scope`
"Bible" = "BIB"
"Bible with Deuterocanon" = "DC"
"New Testament" = "NT"
"New Testament+" = "NTP"         # NT plus Old Testament portions
"Old Testament" = "OT"
"Portions" = "P"
"Selections" = "S"

[rule.type]                      # Biblica's `type`
text = ""
audio = "A"
video = "V"

